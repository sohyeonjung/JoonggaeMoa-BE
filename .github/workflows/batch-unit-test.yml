name: Batch 단위 테스트

on:
  pull_request:
    branches: [develop]
    paths:
      - 'batch/**'
      - 'core/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/batch-unit-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: Batch 단위 테스트 실행
        run: ./gradlew :batch:test --tests '*ScrapePagePersistenceServiceTest'

      - name: 테스트 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-test-results
          path: batch/build/test-results/test/
          if-no-files-found: ignore
